  <line stroke="#CDD2D8" stroke-width="1" x1="406" x2="406" y1="499" y2="1324"/>
  <line stroke="#CDD2D8" stroke-width="1" x1="919" x2="919" y1="499" y2="1324"/>
  <line stroke="#CDD2D8" stroke-width="1" x1="1433" x2="1433" y1="499" y2="1324"/>
  <text fill="#2F5496" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="bold" x="80" y="1359">UNIT PROGRESSION</text>
  <text fill="#4F5864" font-family="Aptos, Calibri, Arial, sans-serif" font-size="17" font-weight="normal" x="1220" y="1359">Study themes are mapped to tested outputs where available</text>
