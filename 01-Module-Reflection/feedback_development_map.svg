  <rect fill="#FFFFFF" height="165" stroke="none" stroke-width="1" width="1840" x="80" y="829"/>
  <rect fill="#2F5496" height="165" stroke="none" stroke-width="1" width="6" x="80" y="829"/>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="25" font-weight="bold" x="100" y="871">Design patterns</text>
  <text fill="#4F5864" font-family="Aptos, Calibri, Arial, sans-serif" font-size="19" font-weight="normal" x="100" y="907">Units 3, 4, 5, 11</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="424" y="871">Creational, structural and</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="424" y="901">behavioural readings informed four</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="424" y="931">banking pattern extensions.</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="937" y="871">7 Strategy, 10 Decorator, 12 Visitor</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="937" y="901">and 13 Factory tests, supplemented</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="937" y="931">by recording failure investigations.</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="1451" y="871">Extension points aid change but</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="1451" y="901">coordination and adapter costs</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="1451" y="931">need their own justification.</text>
