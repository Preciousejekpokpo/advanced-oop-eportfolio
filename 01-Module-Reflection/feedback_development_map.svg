  <text fill="#2F5496" font-family="Aptos, Calibri, Arial, sans-serif" font-size="22" font-weight="bold" x="98.0" y="1412">01–03</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="16" font-weight="normal" x="98.0" y="1446">OO foundations  •  SOLID  •  creation</text>
  <rect fill="#FFFFFF" height="96" stroke="#CDD2D8" stroke-width="1" width="460.0" x="540.0" y="1378"/>
  <text fill="#2F5496" font-family="Aptos, Calibri, Arial, sans-serif" font-size="22" font-weight="bold" x="558.0" y="1412">04–06</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="16" font-weight="normal" x="558.0" y="1446">Structure  •  behaviour  •  concurrency</text>
  <rect fill="#FFFFFF" height="96" stroke="#CDD2D8" stroke-width="1" width="460.0" x="1000.0" y="1378"/>
  <text fill="#2F5496" font-family="Aptos, Calibri, Arial, sans-serif" font-size="22" font-weight="bold" x="1018.0" y="1412">07–09</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="16" font-weight="normal" x="1018.0" y="1446">Secure coding  •  refactoring  •  architecture</text>
  <rect fill="#FFFFFF" height="96" stroke="#CDD2D8" stroke-width="1" width="460.0" x="1460.0" y="1378"/>
  <text fill="#2F5496" font-family="Aptos, Calibri, Arial, sans-serif" font-size="22" font-weight="bold" x="1478.0" y="1412">10–12</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="16" font-weight="normal" x="1478.0" y="1446">Testing  •  injection  •  integration</text>
  <text fill="#4F5864" font-family="Aptos, Calibri, Arial, sans-serif" font-size="17" font-weight="normal" x="80" y="1511">Recorded seminar guidance informed the reflective method. No group participation or production deployment is claimed.</text>
