  <rect fill="#F6F7F8" height="165" stroke="none" stroke-width="1" width="1840" x="80" y="994"/>
  <rect fill="#2F5496" height="165" stroke="none" stroke-width="1" width="6" x="80" y="994"/>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="25" font-weight="bold" x="100" y="1036">Architecture</text>
  <text fill="#4F5864" font-family="Aptos, Calibri, Arial, sans-serif" font-size="19" font-weight="normal" x="100" y="1072">Units 6, 9, 12</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="424" y="1036">Scalability feedback prompted</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="424" y="1066">contention trials. Unit 9 supplied</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="424" y="1096">architecture comparisons.</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="937" y="1036">60 benchmark trials across 1–32</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="937" y="1066">threads; no sustained advantage</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="937" y="1096">for separate account locks.</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="1451" y="1036">Local correctness and timing</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="1451" y="1066">cannot establish large-scale</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="1451" y="1096">capacity or recoverability.</text>
  <line stroke="#CDD2D8" stroke-width="1" x1="80" x2="1920" y1="1159" y2="1159"/>
  <rect fill="#FFFFFF" height="165" stroke="none" stroke-width="1" width="1840" x="80" y="1159"/>
  <rect fill="#2F5496" height="165" stroke="none" stroke-width="1" width="6" x="80" y="1159"/>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="25" font-weight="bold" x="100" y="1201">AI-ready design</text>
  <text fill="#4F5864" font-family="Aptos, Calibri, Arial, sans-serif" font-size="19" font-weight="normal" x="100" y="1237">Units 10, 11, 12</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="424" y="1201">TDD, mocking, injection and AI</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="424" y="1231">ethics study informed a replaceable</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="424" y="1261">model-review boundary.</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="937" y="1201">Nine mocked review tests and</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="937" y="1231">seven capstone tests. Substituted</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="937" y="1261">record amounts still passed checks.</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="1451" y="1201">Mock outputs do not establish</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="1451" y="1231">live-model fairness or reliability.</text>
  <text fill="#242933" font-family="Aptos, Calibri, Arial, sans-serif" font-size="20" font-weight="normal" x="1451" y="1261">Independent evidence remains vital.</text>
